[package]
name = "maven"
version = "0.1.5"
edition = "2024"

[lib]
name = "plugin"
crate-type = ["cdylib"]

[dependencies]
quick-xml = "0.42"
extism-pdk = "=1.4.1"
git-version = "0.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64-serde = "0.8.0"
base64 = "0.23.0"

[package.metadata.release]
publish = false
push = true
tag = true
tag-name = "v{{version}}"
